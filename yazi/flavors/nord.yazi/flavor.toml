#:schema https://yazi-rs.github.io/schemas/theme.json
#
# nord0  #2E3440  nord1  #3B4252  nord2  #434C5E  nord3  #4C566A
# nord4  #D8DEE9  nord5  #E5E9F0  nord6  #ECEFF4
# nord7  #8FBCBB  nord8  #88C0D0  nord9  #81A1C1  nord10 #5E81AC
# nord11 #BF616A  nord12 #D08770  nord13 #EBCB8B  nord14 #A3BE8C  nord15 #B48EAD

[mgr]
cwd = { fg = "#88C0D0" }

find_keyword  = { fg = "#EBCB8B", bold = true, italic = true, underline = true }
find_position = { fg = "#B48EAD", bg = "reset", bold = true, italic = true }

marker_copied   = { fg = "#A3BE8C", bg = "#A3BE8C" }
marker_cut      = { fg = "#BF616A", bg = "#BF616A" }
marker_marked   = { fg = "#8FBCBB", bg = "#8FBCBB" }
marker_selected = { fg = "#EBCB8B", bg = "#EBCB8B" }

count_copied   = { fg = "#2E3440", bg = "#A3BE8C" }
count_cut      = { fg = "#2E3440", bg = "#BF616A" }
count_selected = { fg = "#2E3440", bg = "#EBCB8B" }

border_symbol = "│"
border_style  = { fg = "#4C566A" }

[tabs]
active   = { fg = "#2E3440", bg = "#8FBCBB", bold = true }
inactive = { fg = "#8FBCBB", bg = "#3B4252" }

# lualine normal / visual / replace
[mode]
normal_main = { fg = "#3B4252", bg = "#88C0D0", bold = true }
normal_alt  = { fg = "#E5E9F0", bg = "#3B4252" }
select_main = { fg = "#3B4252", bg = "#8FBCBB", bold = true }
select_alt  = { fg = "#E5E9F0", bg = "#3B4252" }
unset_main  = { fg = "#3B4252", bg = "#EBCB8B", bold = true }
unset_alt   = { fg = "#E5E9F0", bg = "#3B4252" }

[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { underline = true }

[status]
perm_sep   = { fg = "#4C566A" }
perm_type  = { fg = "#81A1C1" }
perm_read  = { fg = "#EBCB8B" }
perm_write = { fg = "#BF616A" }
perm_exec  = { fg = "#A3BE8C" }

progress_label  = { fg = "#ECEFF4", bold = true }
progress_normal = { fg = "#88C0D0", bg = "#434C5E" }
progress_error  = { fg = "#BF616A", bg = "#434C5E" }

[pick]
border   = { fg = "#81A1C1" }
active   = { fg = "#B48EAD", bold = true }
inactive = { fg = "#D8DEE9" }

[input]
border   = { fg = "#81A1C1" }
title    = { fg = "#D8DEE9" }
value    = { fg = "#ECEFF4" }
selected = { reversed = true }

[cmp]
border = { fg = "#81A1C1" }

[tasks]
border  = { fg = "#81A1C1" }
title   = { fg = "#ECEFF4" }
hovered = { fg = "#B48EAD", underline = true }

[which]
mask            = { bg = "#3B4252" }
cand            = { fg = "#8FBCBB" }
rest            = { fg = "#4C566A" }
desc            = { fg = "#B48EAD" }
separator       = "  "
separator_style = { fg = "#434C5E" }

[help]
chord   = { fg = "#8FBCBB" }
action  = { fg = "#B48EAD" }
hovered = { reversed = true, bold = true }

[notify]
title_info  = { fg = "#A3BE8C" }
title_warn  = { fg = "#EBCB8B" }
title_error = { fg = "#BF616A" }

[filetype]
rules = [
	{ mime = "**/image/*", fg = "#8FBCBB" },
	{ mime = "**/{audio,video}/*", fg = "#EBCB8B" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#B48EAD" },
	{ mime = "**/application/{pdf,doc,rtf,odt,docx,xlsx,pptx}", fg = "#A3BE8C" },
	{ url = "*", is = "link", fg = "#B48EAD" },
	{ url = "*", fg = "#D8DEE9" },
	{ url = "*/", fg = "#81A1C1", bold = true },
]

[icon]
prepend_dirs = [
	{ name = ".config", text = "", fg = "#81A1C1" },
	{ name = ".git", text = "", fg = "#81A1C1" },
	{ name = ".github", text = "", fg = "#81A1C1" },
	{ name = ".npm", text = "", fg = "#81A1C1" },
]
prepend_conds = [
	{ if = "dir & !hidden", text = "", fg = "#81A1C1" },
]
