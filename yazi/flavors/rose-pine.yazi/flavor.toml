#:schema https://yazi-rs.github.io/schemas/theme.json

# Rosé Pine (moon). Same layout as nord.yazi; the mode pills copy rose-pine/neovim's lualine theme.
#
# base    #232136  surface #2a273f  overlay #393552  muted #6e6a86  subtle #908caa  text #e0def4
# love    #eb6f92  gold    #f6c177  rose    #ea9a97  pine  #3e8fb0  foam   #9ccfd8  iris #c4a7e7
# hl low  #2a283e  hl med  #44415a  hl high #56526e

[mgr]
cwd = { fg = "#9ccfd8" }

find_keyword  = { fg = "#f6c177", bold = true, italic = true, underline = true }
find_position = { fg = "#c4a7e7", bg = "reset", bold = true, italic = true }

marker_copied   = { fg = "#3e8fb0", bg = "#3e8fb0" }
marker_cut      = { fg = "#eb6f92", bg = "#eb6f92" }
marker_marked   = { fg = "#9ccfd8", bg = "#9ccfd8" }
marker_selected = { fg = "#f6c177", bg = "#f6c177" }

count_copied   = { fg = "#232136", bg = "#3e8fb0" }
count_cut      = { fg = "#232136", bg = "#eb6f92" }
count_selected = { fg = "#232136", bg = "#f6c177" }

border_symbol = "│"
border_style  = { fg = "#6e6a86" }

[tabs]
active   = { fg = "#232136", bg = "#ea9a97", bold = true }
inactive = { fg = "#ea9a97", bg = "#393552" }

# lualine normal / visual / replace
[mode]
normal_main = { fg = "#232136", bg = "#ea9a97", bold = true }
normal_alt  = { fg = "#ea9a97", bg = "#393552" }
select_main = { fg = "#232136", bg = "#c4a7e7", bold = true }
select_alt  = { fg = "#c4a7e7", bg = "#393552" }
unset_main  = { fg = "#232136", bg = "#3e8fb0", bold = true }
unset_alt   = { fg = "#3e8fb0", bg = "#393552" }

[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { underline = true }

[status]
perm_sep   = { fg = "#6e6a86" }
perm_type  = { fg = "#9ccfd8" }
perm_read  = { fg = "#f6c177" }
perm_write = { fg = "#eb6f92" }
perm_exec  = { fg = "#3e8fb0" }

progress_label  = { fg = "#e0def4", bold = true }
progress_normal = { fg = "#9ccfd8", bg = "#44415a" }
progress_error  = { fg = "#eb6f92", bg = "#44415a" }

[pick]
border   = { fg = "#9ccfd8" }
active   = { fg = "#c4a7e7", bold = true }
inactive = { fg = "#e0def4" }

[input]
border   = { fg = "#9ccfd8" }
title    = { fg = "#e0def4" }
value    = { fg = "#e0def4" }
selected = { reversed = true }

[cmp]
border = { fg = "#9ccfd8" }

[tasks]
border  = { fg = "#9ccfd8" }
title   = { fg = "#e0def4" }
hovered = { fg = "#c4a7e7", underline = true }

[which]
mask            = { bg = "#393552" }
cand            = { fg = "#9ccfd8" }
rest            = { fg = "#6e6a86" }
desc            = { fg = "#c4a7e7" }
separator       = "  "
separator_style = { fg = "#44415a" }

[help]
chord   = { fg = "#9ccfd8" }
action  = { fg = "#c4a7e7" }
hovered = { reversed = true, bold = true }

[notify]
title_info  = { fg = "#9ccfd8" }
title_warn  = { fg = "#f6c177" }
title_error = { fg = "#eb6f92" }

[filetype]
rules = [
	{ mime = "**/image/*", fg = "#9ccfd8" },
	{ mime = "**/{audio,video}/*", fg = "#f6c177" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#c4a7e7" },
	{ mime = "**/application/{pdf,doc,rtf,odt,docx,xlsx,pptx}", fg = "#3e8fb0" },
	{ url = "*", is = "link", fg = "#c4a7e7" },
	{ url = "*", fg = "#e0def4" },
	{ url = "*/", fg = "#9ccfd8", bold = true },
]

[icon]
prepend_dirs = [
	{ name = ".config", text = "", fg = "#9ccfd8" },
	{ name = ".git", text = "", fg = "#9ccfd8" },
	{ name = ".github", text = "", fg = "#9ccfd8" },
	{ name = ".npm", text = "", fg = "#9ccfd8" },
]
prepend_conds = [
	{ if = "dir & !hidden", text = "", fg = "#9ccfd8" },
]
