# enable colours 
set -ag terminal-overrides ",screen-256color*:Tc"
set-option -g default-terminal "screen-256color"

# prefix key
set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# open new windows in current directory path
bind c new-window -c "#{pane_current_path}"

# split windows 
unbind %
bind v split-window -h -c "#{pane_current_path}"
unbind '"'
bind s split-window -v -c "#{pane_current_path}"

# reload config 
unbind r
bind r source-file ~/dotfiles/tmux/tmux.conf \; display-message "󰑓 Config reloaded"

# resize panes
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

# kill the current pane (no confirmation; overrides the default y/n prompt)
bind x kill-pane

# enable mouse
set -g mouse on

# scrollback
set -g history-limit 50000

# vim motions
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# enable mouse dragging
unbind -T copy-mode-vi MouseDragEnd1Pane

# status line position
set-option -g status-position top

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# nord colour theme; must load before continuum, which appends its auto-save hook to status-right
set -g @plugin "nordtheme/tmux"

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# auto save / restore
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

# pop-up lazygit
bind g display-popup -d "#{pane_current_path}" -E -w 80% -h 80% -E lazygit

# fuzzy-find a project and switch to its tmux session
bind f display-popup -E -B -w 100% -h 100% "~/dotfiles/tmux/scripts/tmux-sessionizer.sh"

# session/window tree: show sessions collapsed by default (press l to expand a session)
bind w choose-tree -Zs

# when a session is destroyed, switch to another one instead of detaching
set -g detach-on-destroy off

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/dotfiles/tmux/plugins/tpm/tpm'

# re-add fill= that nord's message-style drops, so the command prompt paints over the status line (must come after tpm loads nord)
set -g message-style "bg=brightblack,fg=cyan,fill=brightblack"
set -g message-command-style "bg=brightblack,fg=cyan,fill=brightblack"

# let the status bar's fill (empty strip between segments) show through to Ghostty's transparency
set -g status-style "bg=default,fg=white"

# minimal window list: plain text instead of nord's boxed style, with an accent underline on the active window only
nord_accent="#88C0D0"
nord_green="#A3BE8C"
nord_muted="#4C566A"
set -g status-left-length 40
set -g status-left "#[fg=${nord_green},bold] #S #[fg=${nord_muted}]| "
set -g window-status-current-format "#[fg=${nord_accent},bold,underscore] #I: #W "
set -g window-status-format " #I: #W "

# drop date/time and the hostname box (#H only showed the DHCP wifi hostname); keep the continuum auto-save hook and prefix highlight
set -g status-right "#(/Users/aleckshen/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#{prefix_highlight}"

# blank spacer line below the status bar, matching Ghostty's padding above it; must come after tpm's run since nord's plugin sets `status on`
set -g status 2
set -g 'status-format[1]' ''
